<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">仓库管理流程图</text>
  <text x="300" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">仓库管理</text>
  <text x="900" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">仓位管理</text>

  <!-- 左侧流程：仓库管理 -->
  <circle cx="300" cy="120" r="28" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="300" y="125" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="220" y="170" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="200" text-anchor="middle" font-size="14" fill="#1e293b">仓库列表</text>

  <rect x="220" y="250" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="280" text-anchor="middle" font-size="14" fill="#1e293b">新增仓库</text>

  <polygon points="240,330 400,330 380,420 220,420" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="310" y="358" text-anchor="middle" font-size="14" fill="#1e293b">填写仓库信息</text>
  <text x="310" y="378" text-anchor="middle" font-size="11" fill="#475569">编码/名称/属性/负责人</text>
  <text x="310" y="395" text-anchor="middle" font-size="11" fill="#475569">地址/状态</text>

  <polygon points="300,440 400,490 300,540 200,490" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="485" text-anchor="middle" font-size="13" fill="#1e293b">仓库属性</text>
  <text x="300" y="503" text-anchor="middle" font-size="13" fill="#1e293b">为实物仓?</text>

  <rect x="220" y="570" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="600" text-anchor="middle" font-size="14" fill="#1e293b">保存</text>

  <rect x="220" y="650" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="680" text-anchor="middle" font-size="14" fill="#1e293b">启用/禁用</text>

  <circle cx="300" cy="740" r="28" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="300" y="745" text-anchor="middle" font-size="14" fill="white">完成</text>

  <!-- 右侧流程：仓位管理 -->
  <circle cx="900" cy="120" r="28" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="900" y="125" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="820" y="170" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="200" text-anchor="middle" font-size="14" fill="#1e293b">仓库列表</text>

  <rect x="820" y="250" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="280" text-anchor="middle" font-size="14" fill="#1e293b">选择仓库</text>

  <rect x="820" y="330" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="360" text-anchor="middle" font-size="14" fill="#1e293b">新增仓位</text>

  <polygon points="840,410 1000,410 980,490 820,490" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="910" y="445" text-anchor="middle" font-size="13" fill="#1e293b">填写仓位编码</text>
  <text x="910" y="465" text-anchor="middle" font-size="13" fill="#1e293b">仓位名称</text>

  <rect x="820" y="520" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="550" text-anchor="middle" font-size="14" fill="#1e293b">保存</text>

  <circle cx="900" cy="620" r="28" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="900" y="625" text-anchor="middle" font-size="14" fill="white">完成</text>

  <!-- 左侧连接线 -->
  <line x1="300" y1="148" x2="300" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="220" x2="300" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="300" x2="300" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="420" x2="300" y2="438" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="540" x2="300" y2="568" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="620" x2="300" y2="648" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="700" x2="300" y2="712" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 决策"是"分支：指向右侧仓位管理流程 -->
  <path d="M 400 490 L 700 490 L 700 275 L 818 275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="482" text-anchor="middle" font-size="13" fill="#059669" font-weight="bold">是</text>
  <text x="610" y="475" text-anchor="middle" font-size="11" fill="#475569">(进行仓位管理)</text>

  <!-- 决策"否"标注 -->
  <text x="315" y="558" text-anchor="start" font-size="13" fill="#dc2626" font-weight="bold">否</text>

  <!-- 右侧连接线 -->
  <line x1="900" y1="148" x2="900" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="220" x2="900" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="300" x2="900" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="380" x2="900" y2="408" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="490" x2="900" y2="518" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="570" x2="900" y2="592" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
