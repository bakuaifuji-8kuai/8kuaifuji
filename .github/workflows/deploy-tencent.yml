name: Deploy to Tencent Cloud COS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install COS CLI
        run: |
          npm install -g cos-nodejs-sdk-v5
          npm install -g coscmd

      - name: Configure COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
        run: |
          coscmd config -a $TENCENT_SECRET_ID -s $TENCENT_SECRET_KEY -r $TENCENT_COS_REGION -b $TENCENT_COS_BUCKET

      - name: Deploy to COS
        env:
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
        run: |
          coscmd upload -rs ./dist/ / --force

      - name: Print deployment URL
        env:
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          echo "🎉 部署成功！"
          echo "访问地址: https://${TENCENT_COS_BUCKET}.cos-website.${TENCENT_COS_REGION}.myqcloud.com"
