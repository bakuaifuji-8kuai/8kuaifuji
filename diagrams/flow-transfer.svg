<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Microsoft YaHei, 微软雅黑, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">仓库调拨管理流程图</text>

  <!-- ============ 左侧：状态流转 ============ -->
  <text x="180" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">状态流转</text>

  <rect x="110" y="142" width="140" height="36" rx="18" ry="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold">草稿</text>

  <rect x="110" y="207" width="140" height="36" rx="18" ry="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="225" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold">待审核</text>

  <rect x="110" y="272" width="140" height="36" rx="18" ry="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold">已审核</text>

  <rect x="110" y="337" width="140" height="36" rx="18" ry="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="355" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold">出库中</text>

  <rect x="110" y="402" width="140" height="36" rx="18" ry="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="180" y="420" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#065f46">已完成</text>

  <rect x="335" y="207" width="130" height="36" rx="18" ry="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="225" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#991b1b">已驳回</text>

  <!-- 状态流转 连接线 -->
  <line x1="180" y1="178" x2="180" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="243" x2="180" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="260" font-size="12" fill="#059669" font-weight="bold">通过</text>
  <line x1="180" y1="308" x2="180" y2="335" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="373" x2="180" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="250" y1="225" x2="333" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="216" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">不通过</text>

  <!-- 已驳回 退回草稿（虚线） -->
  <polyline points="400,207 400,120 180,120 180,140" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="290" y="112" text-anchor="middle" font-size="12" fill="#64748b">修改后重新提交</text>

  <!-- ============ 右侧：主流程 ============ -->
  <!-- 主流程 连接线 -->
  <line x1="750" y1="121" x2="750" y2="131" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="173" x2="750" y2="188" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="230" x2="750" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="287" x2="750" y2="302" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="344" x2="750" y2="359" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="401" x2="750" y2="416" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="458" x2="750" y2="473" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="515" x2="750" y2="535" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="615" x2="750" y2="639" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="628" font-size="13" fill="#059669" font-weight="bold">是</text>
  <line x1="750" y1="681" x2="750" y2="694" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="736" x2="750" y2="749" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="791" x2="750" y2="799" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 决策 否 分支 -->
  <line x1="870" y1="575" x2="930" y2="575" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="566" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="bold">否</text>

  <!-- 退回修改 回到保存 -->
  <polyline points="1010,554 1010,437 862,437" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 主流程 节点 -->
  <circle cx="750" cy="95" r="26" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="750" y="95" text-anchor="middle" dominant-baseline="central" fill="white" font-size="14" font-weight="bold">开始</text>

  <rect x="640" y="131" width="220" height="42" rx="6" ry="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="152" text-anchor="middle" dominant-baseline="central" font-size="14">创建调拨单</text>

  <rect x="640" y="188" width="220" height="42" rx="6" ry="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="209" text-anchor="middle" dominant-baseline="central" font-size="14">选择源仓库</text>

  <rect x="640" y="245" width="220" height="42" rx="6" ry="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="266" text-anchor="middle" dominant-baseline="central" font-size="14">选择目标仓库</text>

  <polygon points="655,302 860,302 845,344 640,344" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="750" y="323" text-anchor="middle" dominant-baseline="central" font-size="14">选择物资</text>

  <polygon points="655,359 860,359 845,401 640,401" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="750" y="380" text-anchor="middle" dominant-baseline="central" font-size="14">填写调拨数量</text>

  <rect x="640" y="416" width="220" height="42" rx="6" ry="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="437" text-anchor="middle" dominant-baseline="central" font-size="14">保存</text>

  <rect x="640" y="473" width="220" height="42" rx="6" ry="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="494" text-anchor="middle" dominant-baseline="central" font-size="14">提交</text>

  <!-- 决策菱形 -->
  <polygon points="750,535 870,575 750,615 630,575" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="750" y="575" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold">审核是否通过？</text>

  <rect x="640" y="639" width="220" height="42" rx="6" ry="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="660" text-anchor="middle" dominant-baseline="central" font-size="14">已审核</text>

  <rect x="640" y="694" width="220" height="42" rx="6" ry="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="715" text-anchor="middle" dominant-baseline="central" font-size="14">出库（源仓库扣减）</text>

  <rect x="640" y="749" width="220" height="42" rx="6" ry="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="770" text-anchor="middle" dominant-baseline="central" font-size="14">入库（目标仓库增加）</text>

  <circle cx="750" cy="825" r="26" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="750" y="825" text-anchor="middle" dominant-baseline="central" fill="white" font-size="14" font-weight="bold">完成</text>

  <!-- 退回修改 节点 -->
  <rect x="930" y="554" width="160" height="42" rx="6" ry="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1010" y="575" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#991b1b" font-weight="bold">退回修改</text>

  <!-- 备注 -->
  <rect x="640" y="858" width="450" height="30" rx="6" ry="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="865" y="873" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#475569">备注：所有单据生成后即可打印</text>
</svg>
