<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">基础资料流程图</text>

  <!-- 第一行模块标题 -->
  <text x="200" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">仓库管理</text>
  <text x="600" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">物资分类</text>
  <text x="1000" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">物资档案</text>

  <!-- 模块1：仓库管理 -->
  <circle cx="200" cy="115" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="200" y="120" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="120" y="155" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="183" text-anchor="middle" font-size="14" fill="#1e293b">新增/编辑仓库</text>

  <rect x="120" y="220" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="248" text-anchor="middle" font-size="14" fill="#1e293b">仓位管理</text>

  <circle cx="200" cy="305" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="200" y="310" text-anchor="middle" font-size="14" fill="white">完成</text>

  <!-- 模块2：物资分类 -->
  <circle cx="600" cy="115" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="520" y="155" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="183" text-anchor="middle" font-size="14" fill="#1e293b">新增分类树</text>

  <rect x="520" y="220" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="248" text-anchor="middle" font-size="14" fill="#1e293b">物资档案</text>

  <circle cx="600" cy="305" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="600" y="310" text-anchor="middle" font-size="14" fill="white">完成</text>

  <!-- 模块3：物资档案 -->
  <circle cx="1000" cy="115" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="1000" y="120" text-anchor="middle" font-size="14" fill="white">开始</text>

  <polygon points="920,150 1095,150 1075,235 900,235" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="998" y="178" text-anchor="middle" font-size="14" fill="#1e293b">新增物资</text>
  <text x="998" y="200" text-anchor="middle" font-size="11" fill="#475569">编码/名称/规格</text>
  <text x="998" y="217" text-anchor="middle" font-size="11" fill="#475569">单位/分类</text>

  <rect x="920" y="250" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1000" y="278" text-anchor="middle" font-size="14" fill="#1e293b">保存</text>

  <circle cx="1000" cy="325" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="1000" y="330" text-anchor="middle" font-size="14" fill="white">完成</text>

  <!-- 第二行模块标题 -->
  <text x="200" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">供应商管理</text>
  <text x="600" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">工单物资配置</text>
  <text x="1000" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">用户管理</text>

  <!-- 模块4：供应商管理 -->
  <circle cx="200" cy="415" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="200" y="420" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="120" y="455" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="483" text-anchor="middle" font-size="14" fill="#1e293b">新增供应商</text>

  <polygon points="200,515 295,555 200,595 105,555" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="550" text-anchor="middle" font-size="13" fill="#1e293b">资质审核</text>
  <text x="200" y="568" text-anchor="middle" font-size="13" fill="#1e293b">通过?</text>

  <rect x="120" y="615" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="643" text-anchor="middle" font-size="14" fill="#1e293b">启用</text>

  <circle cx="200" cy="700" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="200" y="705" text-anchor="middle" font-size="14" fill="white">完成</text>

  <!-- 模块5：工单物资配置 -->
  <circle cx="600" cy="415" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="600" y="420" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="520" y="455" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="483" text-anchor="middle" font-size="14" fill="#1e293b">选择作业项目</text>

  <rect x="520" y="515" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="543" text-anchor="middle" font-size="14" fill="#1e293b">配置主料</text>

  <rect x="520" y="575" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="603" text-anchor="middle" font-size="14" fill="#1e293b">配置辅料</text>

  <rect x="520" y="635" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="663" text-anchor="middle" font-size="14" fill="#1e293b">保存</text>

  <circle cx="600" cy="710" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="600" y="715" text-anchor="middle" font-size="14" fill="white">完成</text>

  <!-- 模块6：用户管理 -->
  <circle cx="1000" cy="415" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="1000" y="420" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="920" y="455" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1000" y="483" text-anchor="middle" font-size="14" fill="#1e293b">新增用户</text>

  <rect x="920" y="515" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1000" y="543" text-anchor="middle" font-size="14" fill="#1e293b">分配角色</text>

  <rect x="920" y="575" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1000" y="603" text-anchor="middle" font-size="14" fill="#1e293b">启用</text>

  <circle cx="1000" cy="650" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="1000" y="655" text-anchor="middle" font-size="14" fill="white">完成</text>

  <!-- 模块1连接线 -->
  <line x1="200" y1="140" x2="200" y2="153" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="200" x2="200" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="265" x2="200" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 模块2连接线 -->
  <line x1="600" y1="140" x2="600" y2="153" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="200" x2="600" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="265" x2="600" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 模块3连接线 -->
  <line x1="1000" y1="140" x2="1000" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="235" x2="1000" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="295" x2="1000" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 模块4连接线（供应商管理） -->
  <line x1="200" y1="440" x2="200" y2="453" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="500" x2="200" y2="515" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="595" x2="200" y2="613" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="608" text-anchor="start" font-size="13" fill="#059669" font-weight="bold">是</text>
  <line x1="200" y1="660" x2="200" y2="675" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- "否"分支：回到新增供应商 -->
  <path d="M 105 555 L 60 555 L 60 478 L 118 478" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="50" y="520" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="bold">否</text>

  <!-- 模块5连接线 -->
  <line x1="600" y1="440" x2="600" y2="453" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="500" x2="600" y2="513" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="560" x2="600" y2="573" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="620" x2="600" y2="633" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="680" x2="600" y2="685" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 模块6连接线 -->
  <line x1="1000" y1="440" x2="1000" y2="453" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="500" x2="1000" y2="513" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="560" x2="1000" y2="573" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="620" x2="1000" y2="625" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
