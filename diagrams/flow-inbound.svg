<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">入库管理流程图</text>

  <text x="200" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">采购入库</text>
  <text x="600" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">自制入库</text>
  <text x="1000" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">退库入库</text>

  <!-- 列1：采购入库 -->
  <circle cx="200" cy="115" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="200" y="120" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="120" y="155" width="160" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="178" text-anchor="middle" font-size="14" fill="#1e293b">创建入库单</text>
  <text x="200" y="196" text-anchor="middle" font-size="11" fill="#475569">(选择采购订单)</text>

  <rect x="120" y="225" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="253" text-anchor="middle" font-size="14" fill="#1e293b">选择物资</text>

  <polygon points="135,285 295,285 280,330 120,330" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="207" y="313" text-anchor="middle" font-size="13" fill="#1e293b">填写入库数量</text>

  <rect x="120" y="345" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="373" text-anchor="middle" font-size="14" fill="#1e293b">保存</text>

  <rect x="120" y="405" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="433" text-anchor="middle" font-size="14" fill="#1e293b">提交</text>

  <rect x="120" y="465" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="493" text-anchor="middle" font-size="14" fill="#1e293b">确认入库</text>

  <!-- 列2：自制入库 -->
  <circle cx="600" cy="115" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="520" y="155" width="160" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="178" text-anchor="middle" font-size="14" fill="#1e293b">创建入库单</text>
  <text x="600" y="196" text-anchor="middle" font-size="11" fill="#475569">(自制入库)</text>

  <rect x="520" y="225" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="253" text-anchor="middle" font-size="14" fill="#1e293b">选择物资</text>

  <polygon points="535,285 695,285 680,330 520,330" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="607" y="313" text-anchor="middle" font-size="13" fill="#1e293b">填写入库数量</text>

  <rect x="520" y="345" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="373" text-anchor="middle" font-size="14" fill="#1e293b">保存</text>

  <rect x="520" y="405" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="433" text-anchor="middle" font-size="14" fill="#1e293b">提交</text>

  <rect x="520" y="465" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="493" text-anchor="middle" font-size="14" fill="#1e293b">确认入库</text>

  <!-- 列3：退库 -->
  <circle cx="1000" cy="115" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="1000" y="120" text-anchor="middle" font-size="14" fill="white">开始</text>

  <rect x="920" y="155" width="160" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1000" y="178" text-anchor="middle" font-size="14" fill="#1e293b">创建退库单</text>
  <text x="1000" y="196" text-anchor="middle" font-size="11" fill="#475569">(退库入库)</text>

  <rect x="920" y="225" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1000" y="253" text-anchor="middle" font-size="14" fill="#1e293b">选择物资</text>

  <polygon points="935,285 1095,285 1080,330 920,330" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1007" y="313" text-anchor="middle" font-size="13" fill="#1e293b">填写退库数量</text>

  <rect x="920" y="345" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1000" y="373" text-anchor="middle" font-size="14" fill="#1e293b">保存</text>

  <rect x="920" y="405" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1000" y="433" text-anchor="middle" font-size="14" fill="#1e293b">提交</text>

  <rect x="920" y="465" width="160" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1000" y="493" text-anchor="middle" font-size="14" fill="#1e293b">确认入库</text>

  <!-- 库存更新（汇聚） -->
  <rect x="500" y="555" width="200" height="55" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="588" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="bold">库存更新</text>

  <circle cx="600" cy="650" r="25" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="600" y="655" text-anchor="middle" font-size="14" fill="white">完成</text>

  <!-- 汇聚连接线 -->
  <path d="M 200 510 L 200 535 L 540 535 L 540 553" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="510" x2="600" y2="553" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1000 510 L 1000 535 L 660 535 L 660 553" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="600" y1="610" x2="600" y2="625" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 状态流转 -->
  <text x="600" y="705" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">单据状态流转</text>
  <rect x="380" y="720" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="745" text-anchor="middle" font-size="14" fill="#1e293b">草稿</text>

  <rect x="540" y="720" width="120" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="745" text-anchor="middle" font-size="14" fill="#1e293b">待审核</text>

  <rect x="700" y="720" width="120" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="760" y="745" text-anchor="middle" font-size="14" fill="#1e293b">已入库</text>

  <line x1="500" y1="740" x2="538" y2="740" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="740" x2="698" y2="740" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 列1连接线 -->
  <line x1="200" y1="140" x2="200" y2="153" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="210" x2="200" y2="223" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="270" x2="200" y2="283" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="330" x2="200" y2="343" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="390" x2="200" y2="403" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="450" x2="200" y2="463" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 列2连接线 -->
  <line x1="600" y1="140" x2="600" y2="153" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="210" x2="600" y2="223" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="270" x2="600" y2="283" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="330" x2="600" y2="343" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="390" x2="600" y2="403" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="450" x2="600" y2="463" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 列3连接线 -->
  <line x1="1000" y1="140" x2="1000" y2="153" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="210" x2="1000" y2="223" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="270" x2="1000" y2="283" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="330" x2="1000" y2="343" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="390" x2="1000" y2="403" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="450" x2="1000" y2="463" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
