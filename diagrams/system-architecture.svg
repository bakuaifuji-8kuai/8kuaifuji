  <text x="40" y="620" font-size="10" fill="#f59e0b">Deploy</text>

  <!-- GitHub Pages -->
  <rect x="355" y="575" width="280" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M378 600 Q378 588 388 588 Q396 588 398 594 Q402 590 408 594 Q414 596 410 604 Q418 608 412 616 Q404 622 394 618 Q386 622 378 616 Q372 612 376 604 Q372 600 378 600 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="510" y="600" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">GitHub Pages</text>
  <text x="510" y="618" text-anchor="middle" font-size="10" fill="#f59e0b">静态站点托管</text>

  <!-- GitHub Actions CI/CD -->
  <rect x="695" y="575" width="280" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="720" cy="605" r="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="720" cy="605" r="3" fill="#f59e0b"/>
  <path d="M716 598 L724 598 M726 601 L730 608 M724 612 L716 612 M714 608 L710 601" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <text x="838" y="600" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">GitHub Actions CI/CD</text>
  <text x="838" y="618" text-anchor="middle" font-size="10" fill="#f59e0b">自动化构建部署</text>

  <!-- Legend -->
  <text x="1170" y="675" text-anchor="end" font-size="10" fill="#64748b">仓库管理系统架构 v1.0</text>
