  <rect x="704" y="88" width="20" height="32" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <line x1="708" y1="93" x2="720" y2="93" stroke="#3b82f6" stroke-width="0.8"/>
  <circle cx="714" cy="115" r="1.5" fill="#3b82f6"/>
  <text x="800" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">移动端APP</text>
  <text x="800" y="118" text-anchor="middle" font-size="10" fill="#3b82f6">iOS / Android</text>

