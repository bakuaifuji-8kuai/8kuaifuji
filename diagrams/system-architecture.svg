  <text x="515" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4</text>
  <text x="560" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">出库管理</text>
  <text x="560" y="368" text-anchor="middle" font-size="9" fill="#06b3d4">Outbound</text>

