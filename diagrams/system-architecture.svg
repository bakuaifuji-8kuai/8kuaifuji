  <circle cx="170" cy="345" r="9" fill="#06b3d4"/>
  <text x="170" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <text x="215" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">采购管理</text>
  <text x="215" y="368" text-anchor="middle" font-size="9" fill="#06b3d4">Purchase</text>

  <!-- 2. 库存管理 -->
  <rect x="267" y="325" width="105" height="55" rx="8" fill="#cffafe" stroke="#06b3d4" stroke-width="1.5"/>
  <circle cx="285" cy="345" r="9" fill="#06b3d4"/>
  <text x="285" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
