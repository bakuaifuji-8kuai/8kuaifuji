  <rect x="525" y="450" width="280" height="60" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="465" width="32" height="30" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <path d="M549 472 L573 472 M549 478 L573 478 M549 484 L569 484" stroke="#10b981" stroke-width="0.8"/>
