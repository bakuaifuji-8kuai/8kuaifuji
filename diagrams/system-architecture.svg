      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">仓库管理系统 - 系统架构图</text>

  <!-- ===== Layer 1: User Layer ===== -->
  <rect x="20" y="55" width="1160" height="95" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" rx="8"/>
