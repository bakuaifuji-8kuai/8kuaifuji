  <rect x="727" y="325" width="105" height="55" rx="8" fill="#cffafe" stroke="#06b3d4" stroke-width="1.5"/>
  <circle cx="745" cy="345" r="9" fill="#06b3d4"/>
  <text x="745" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">6</text>
  <text x="790" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">调拨管理</text>
  <text x="790" y="368" text-anchor="middle" font-size="9" fill="#06b3d4">Transfer</text>

  <!-- 7. 固定资产管理 -->
  <rect x="842" y="325" width="105" height="55" rx="8" fill="#cffafe" stroke="#06b3d4" stroke-width="1.5"/>
  <circle cx="860" cy="345" r="9" fill="#06b3d4"/>
  <text x="860" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">7</text>
  <text x="905" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">固定资产</text>
  <text x="905" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">管理</text>
  <text x="905" y="372" text-anchor="middle" font-size="8" fill="#06b3d4">Fixed Assets</text>

  <!-- 8. 基础资料 -->
  <rect x="957" y="325" width="105" height="55" rx="8" fill="#cffafe" stroke="#06b3d4" stroke-width="1.5"/>
  <circle cx="975" cy="345" r="9" fill="#06b3d4"/>
  <text x="975" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">8</text>
  <text x="1020" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">基础资料</text>
  <text x="1020" y="368" text-anchor="middle" font-size="9" fill="#06b3d4">Master Data</text>

  <!-- 9. 报表管理 -->
  <rect x="1072" y="325" width="105" height="55" rx="8" fill="#cffafe" stroke="#06b3d4" stroke-width="1.5"/>
  <circle cx="1090" cy="345" r="9" fill="#06b3d4"/>
  <text x="1090" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">9</text>
  <text x="1135" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">报表管理</text>
  <text x="1135" y="368" text-anchor="middle" font-size="9" fill="#06b3d4">Reports</text>

