  <text x="40" y="120" font-size="10" fill="#3b82f6">User Layer</text>

  <!-- Web Browser -->
  <rect x="450" y="75" width="180" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="462" y="92" width="26" height="20" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <line x1="462" y1="99" x2="488" y2="99" stroke="#3b82f6" stroke-width="0.8"/>
  <circle cx="467" cy="96" r="1.2" fill="#ef4444"/>
  <circle cx="471" cy="96" r="1.2" fill="#f59e0b"/>
  <circle cx="475" cy="96" r="1.2" fill="#10b981"/>
  <text x="555" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Web浏览器</text>
  <text x="555" y="118" text-anchor="middle" font-size="10" fill="#3b82f6">Chrome / Edge / Safari</text>

  <!-- Mobile App -->
