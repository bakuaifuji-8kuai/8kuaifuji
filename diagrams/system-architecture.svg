  <text x="675" y="346" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">展会物资</text>
  <text x="675" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">调拨管理</text>
  <text x="675" y="372" text-anchor="middle" font-size="8" fill="#06b3d4">Exhibit Transfer</text>

