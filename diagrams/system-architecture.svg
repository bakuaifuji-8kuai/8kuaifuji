  <text x="400" y="349" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <text x="445" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">入库管理</text>
  <text x="445" y="368" text-anchor="middle" font-size="9" fill="#06b3d4">Inbound</text>

  <!-- 4. 出库管理 -->
  <rect x="497" y="325" width="105" height="55" rx="8" fill="#cffafe" stroke="#06b3d4" stroke-width="1.5"/>
