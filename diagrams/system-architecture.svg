  <text x="675" y="496" text-anchor="middle" font-size="10" fill="#10b981">全局状态容器</text>

  <!-- localStorage -->
  <rect x="835" y="450" width="280" height="60" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <ellipse cx="860" cy="466" rx="14" ry="4" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <path d="M846 466 L846 494 Q846 498 860 498 Q874 498 874 494 L874 466" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
  <ellipse cx="860" cy="466" rx="14" ry="4" fill="none" stroke="#10b981" stroke-width="1"/>
  <text x="975" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">localStorage持久化</text>
  <text x="975" y="496" text-anchor="middle" font-size="10" fill="#10b981">浏览器本地存储</text>

  <!-- Arrow 4: Data -> Deployment -->
  <line x1="600" y1="525" x2="600" y2="553" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- ===== Layer 5: Deployment Layer ===== -->
  <rect x="20" y="555" width="1160" height="95" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" rx="8"/>
