<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/></filter>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">招采需求申请 · 业务流程图</text>
  <text x="600" y="66" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">3 种需求入口 → 需求确认 → 招采执行（9 种方式）/ 直接合同</text>
  <rect x="110" y="120" width="230" height="65" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225" y="146" text-anchor="middle" font-size="13" fill="#4338ca" font-weight="700" font-family="sans-serif">场景化需求（工程类）</text>
  <text x="225" y="168" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">含工位/展位号/作业项</text>
  <rect x="460" y="120" width="230" height="65" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="575" y="146" text-anchor="middle" font-size="13" fill="#4338ca" font-weight="700" font-family="sans-serif">场景化需求（非工程类）</text>
  <text x="575" y="168" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">不含工位号，直接清单</text>
  <rect x="810" y="120" width="230" height="65" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="925" y="146" text-anchor="middle" font-size="13" fill="#4338ca" font-weight="700" font-family="sans-serif">标准需求申请</text>
  <text x="925" y="168" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">传统通用申请</text>
  <line x1="225" y1="185" x2="600" y2="260" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="185" x2="600" y2="260" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="925" y1="185" x2="600" y2="260" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="260" width="260" height="50" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="600" y="283" text-anchor="middle" font-size="13" fill="#4338ca" font-weight="700" font-family="sans-serif">需求单草稿（ProcurementDemand）</text>
  <text x="600" y="300" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">提交后进入审批流</text>
  <line x1="600" y1="310" x2="600" y2="355" stroke="#6366f1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polygon points="600,355 670,385 600,415 530,385" fill="#fff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="600" y="389" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca" font-family="sans-serif">审批？</text>
  <line x1="530" y1="385" x2="330" y2="385" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="410" y="379" font-size="11" fill="#ef4444" font-weight="600" font-family="sans-serif">驳回</text>
  <rect x="180" y="360" width="150" height="50" rx="8" fill="#fff" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="255" y="383" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700" font-family="sans-serif">退回修改</text>
  <path d="M 180,385 L 90,385 L 90,285 L 470,285" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="22" y="340" font-size="10.5" fill="#ef4444" font-family="sans-serif">重新提交</text>
  <line x1="670" y1="385" x2="900" y2="385" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="770" y="379" font-size="11" fill="#10b981" font-weight="600" font-family="sans-serif">通过</text>
  <rect x="900" y="360" width="200" height="50" rx="8" fill="#fff" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1000" y="383" text-anchor="middle" font-size="13" fill="#047857" font-weight="700" font-family="sans-serif">需求确认</text>
  <text x="1000" y="400" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">立项通过 / 锁定明细</text>
  <line x1="1000" y1="410" x2="1000" y2="460" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polygon points="1000,460 1060,490 1000,520 940,490" fill="#fff" stroke="#10b981" stroke-width="1.8"/>
  <text x="1000" y="494" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857" font-family="sans-serif">是否招采？</text>
  <line x1="940" y1="490" x2="620" y2="490" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="760" y="484" font-size="11" fill="#f97316" font-weight="600" font-family="sans-serif">是（9 种方式可选）</text>
  <rect x="400" y="465" width="220" height="50" rx="8" fill="#fff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="488" text-anchor="middle" font-size="12.5" fill="#c2410c" font-weight="700" font-family="sans-serif">招采执行（9 种方式）</text>
  <text x="510" y="503" text-anchor="middle" font-size="10" fill="#64748b" font-family="sans-serif">目录内比价 / 随机抽取 / 询比 / 竞价 / 谈判 / 直接 / 电子商城</text>
  <path d="M 1060,490 L 1140,490 L 1140,550" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="1090" y="484" font-size="11" fill="#64748b" font-weight="600" font-family="sans-serif">否</text>
  <rect x="1085" y="545" width="110" height="40" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1140" y="570" text-anchor="middle" font-size="12" fill="#334155" font-weight="600" font-family="sans-serif">直接合同</text>
  <rect x="380" y="615" width="440" height="60" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="600" y="638" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca" font-family="sans-serif">📊 需求台账（DemandLedger）</text>
  <text x="600" y="658" text-anchor="middle" font-size="11" fill="#64748b" font-family="sans-serif">汇总所有状态需求单 · 按状态/类型/展会筛选 · 全链路追踪</text>
</svg>