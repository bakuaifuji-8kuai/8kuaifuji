<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580">
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/></filter>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b" font-family="sans-serif">招采计划 · 业务流程图</text>
  <text x="600" y="66" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">独立模块 · 与招采需求无强制串联 · 仅作可选参考</text>
  <text x="600" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af" font-family="sans-serif">招采计划（两种类型）</text>
  <rect x="340" y="130" width="160" height="50" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="420" y="153" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="700" font-family="sans-serif">月度招采计划</text>
  <text x="420" y="170" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">按月滚动编制</text>
  <rect x="700" y="130" width="160" height="50" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="780" y="153" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="700" font-family="sans-serif">年度招采计划</text>
  <text x="780" y="170" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">全年统筹安排</text>
  <line x1="500" y1="155" x2="600" y2="210" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="700" y1="155" x2="600" y2="210" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="510" y="210" width="180" height="50" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="600" y="233" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="700" font-family="sans-serif">招采计划汇总</text>
  <text x="600" y="250" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">自动统计各期计划数据</text>
  <line x1="600" y1="260" x2="600" y2="295" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polygon points="600,295 660,325 600,355 540,325" fill="#fff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="600" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af" font-family="sans-serif">审批？</text>
  <line x1="660" y1="325" x2="850" y2="325" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="740" y="319" font-size="11" fill="#10b981" font-weight="600" font-family="sans-serif">通过</text>
  <line x1="540" y1="325" x2="350" y2="325" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="420" y="319" font-size="11" fill="#ef4444" font-weight="600" font-family="sans-serif">驳回</text>
  <rect x="850" y="300" width="160" height="50" rx="8" fill="#fff" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="930" y="323" text-anchor="middle" font-size="13" fill="#047857" font-weight="700" font-family="sans-serif">计划归档</text>
  <text x="930" y="340" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">状态：已批准→归档</text>
  <rect x="200" y="300" width="150" height="50" rx="8" fill="#fff" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="275" y="323" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700" font-family="sans-serif">修改计划</text>
  <text x="275" y="340" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="sans-serif">状态：退回修改</text>
  <path d="M 200,325 L 100,325 L 100,255 L 340,255" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="30" y="295" font-size="10.5" fill="#ef4444" font-family="sans-serif">重新提交</text>
  <rect x="280" y="440" width="640" height="120" rx="10" fill="#fff" stroke="#cbd5e1" stroke-dasharray="6,3"/>
  <text x="600" y="463" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569" font-family="sans-serif">⚠️ 与招采需求的关系（重要）</text>
  <text x="600" y="486" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">计划是独立模块，<tspan font-weight="700" fill="#ef4444">不强制串联</tspan>到需求。</text>
  <text x="600" y="506" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">已审批通过的计划可作需求申报参考，但需求可以不经过计划直接发起。</text>
  <text x="600" y="526" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="sans-serif">数据模型：ProcurementPlan 和 ProcurementDemand 之间无外键依赖。</text>
</svg>