    <text x="548" y="850" font-size="11" fill="#365314" text-anchor="start" dominant-baseline="central">出库流程</text>

    <rect x="740" y="835" width="120" height="30" rx="15" fill="#ecfccb" stroke="#84cc16" stroke-width="1.5"/>
    <text x="852" y="850" font-size="11" fill="#365314" text-anchor="end" dominant-baseline="central">调拨流程</text>

