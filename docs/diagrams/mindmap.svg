    <path d="M 660 130 C 640 100, 620 80, 600 65" stroke="#0ea5e9"/>
    <path d="M 740 130 C 760 100, 780 80, 800 65" stroke="#0ea5e9"/>
    <path d="M 770 150 C 820 150, 830 80, 860 80" stroke="#0ea5e9"/>

