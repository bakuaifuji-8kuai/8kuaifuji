    <text x="1312" y="540" font-size="11" fill="#312e81" text-anchor="end" dominant-baseline="central">资产报废</text>

    <rect x="1190" y="575" width="120" height="30" rx="15" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="1302" y="590" font-size="11" fill="#312e81" text-anchor="end" dominant-baseline="central">资产报损</text>

