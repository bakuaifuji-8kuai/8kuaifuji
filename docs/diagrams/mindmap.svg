<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="900" fill="white"/>

  <!-- Title -->
  <text x="700" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e293b">仓库管理系统 — 功能思维导图</text>
  <text x="700" y="54" font-size="12" text-anchor="middle" fill="#64748b">Mind Map</text>

  <!-- ===== Connections: center -> first-level (cubic bezier) ===== -->
  <g fill="none" stroke-width="2.5">
    <!-- to 报表管理 (top) -->
    <path d="M 700 370 C 700 300, 700 240, 700 170" stroke="#0ea5e9"/>
    <!-- to 库存管理 (top-left) -->
    <path d="M 643 393 C 580 393, 580 240, 540 240" stroke="#3b82f6"/>
    <!-- to 入库管理 (left) -->
    <path d="M 620 450 C 540 450, 500 450, 420 450" stroke="#10b981"/>
    <!-- to 出库管理 (bottom-left) -->
    <path d="M 643 507 C 580 507, 580 660, 540 660" stroke="#f59e0b"/>
    <!-- to 业务流程 (bottom) -->
    <path d="M 700 530 C 700 600, 700 660, 700 730" stroke="#84cc16"/>
    <!-- to 基础资料 (bottom-right) -->
    <path d="M 757 507 C 820 507, 820 660, 860 660" stroke="#ec4899"/>
    <!-- to 固定资产管理 (right) -->
