  <!-- 报表管理 (top, centered text) -->
  <g>
    <rect x="630" y="130" width="140" height="40" rx="20" fill="#0ea5e9"/>
    <text x="700" y="150" fill="white" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">报表管理</text>
  </g>

  <!-- 库存管理 (top-left, left-aligned) -->
  <g>
    <rect x="400" y="220" width="140" height="40" rx="20" fill="#3b82f6"/>
    <text x="410" y="240" fill="white" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="central">库存管理</text>
