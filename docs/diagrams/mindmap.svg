    <path d="M 1000 660 C 1030 660, 1040 580, 1070 580" stroke="#ec4899"/>
    <path d="M 1000 660 C 1030 660, 1060 630, 1090 630" stroke="#ec4899"/>
    <path d="M 1000 660 C 1030 660, 1060 680, 1090 680" stroke="#ec4899"/>
    <path d="M 1000 660 C 1030 660, 1040 730, 1070 730" stroke="#ec4899"/>
    <path d="M 1000 660 C 1030 660, 1060 780, 1090 780" stroke="#ec4899"/>
    <path d="M 1000 660 C 1030 660, 1040 830, 1070 830" stroke="#ec4899"/>

