    <text x="1202" y="780" font-size="11" fill="#831843" text-anchor="end" dominant-baseline="central">物资申请审批</text>

    <rect x="1070" y="815" width="120" height="30" rx="15" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
