    <path d="M 1120 450 C 1150 450, 1140 290, 1170 290" stroke="#6366f1"/>
    <path d="M 1120 450 C 1150 450, 1160 340, 1190 340" stroke="#6366f1"/>
    <path d="M 1120 450 C 1150 450, 1170 390, 1200 390" stroke="#6366f1"/>
    <path d="M 1120 450 C 1150 450, 1170 440, 1200 440" stroke="#6366f1"/>
    <path d="M 1120 450 C 1150 450, 1170 490, 1200 490" stroke="#6366f1"/>
    <path d="M 1120 450 C 1150 450, 1170 540, 1200 540" stroke="#6366f1"/>
    <path d="M 1120 450 C 1150 450, 1160 590, 1190 590" stroke="#6366f1"/>
    <path d="M 1120 450 C 1150 450, 1140 640, 1170 640" stroke="#6366f1"/>

