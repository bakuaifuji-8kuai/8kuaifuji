    <path d="M 400 240 L 310 240" stroke="#3b82f6"/>
    <path d="M 400 240 C 370 240, 360 300, 330 300" stroke="#3b82f6"/>

    <!-- 入库管理 -> subs (left) -->
    <path d="M 280 450 C 250 450, 250 390, 230 390" stroke="#10b981"/>
    <path d="M 280 450 L 210 450" stroke="#10b981"/>
    <path d="M 280 450 C 250 450, 250 510, 230 510" stroke="#10b981"/>

    <!-- 出库管理 -> subs (left) -->
    <path d="M 400 660 C 370 660, 360 600, 330 600" stroke="#f59e0b"/>
    <path d="M 400 660 L 310 660" stroke="#f59e0b"/>
    <path d="M 400 660 C 370 660, 360 720, 330 720" stroke="#f59e0b"/>

    <!-- 调拨管理 -> subs (right) -->
    <path d="M 1000 240 C 1030 240, 1040 180, 1070 180" stroke="#06b3d4"/>
    <path d="M 1000 240 L 1090 240" stroke="#06b3d4"/>
    <path d="M 1000 240 C 1030 240, 1040 300, 1070 300" stroke="#06b3d4"/>

