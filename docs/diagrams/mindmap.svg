    <rect x="740" y="35" width="120" height="30" rx="15" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="852" y="50" font-size="11" fill="#0c4a6e" text-anchor="end" dominant-baseline="central">出库报表</text>

    <rect x="860" y="65" width="120" height="30" rx="15" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
