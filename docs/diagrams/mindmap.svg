  <text x="700" y="445" fill="white" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">仓库管理</text>
  <text x="700" y="470" fill="white" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">系统</text>

