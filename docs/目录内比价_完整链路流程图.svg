<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" font-family="Inter, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bg-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bg-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bg-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="1280" height="1100" fill="#fafbfc"/>

  <!-- Title -->
  <text x="640" y="32" text-anchor="middle" fill="#1e293b" font-size="18" font-weight="800">招采执行 · 目录内比价 — 完整跨页链路（含供应商小程序报价 + 报价管理页回写）</text>

  <!-- Container: 采购方后台 -->
  <rect x="30" y="50" width="400" height="1000" rx="12" fill="url(#bg-1)" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="30" y="50" width="400" height="44" rx="12" fill="url(#grad-blue)"/>
  <rect x="30" y="80" width="400" height="14" fill="url(#grad-blue)"/>
  <text x="230" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">采购方后台 · 招采执行 CompetitiveBiddingPage</text>

  <!-- Container: 供应商小程序 -->
  <rect x="460" y="50" width="370" height="560" rx="12" fill="url(#bg-2)" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="460" y="50" width="370" height="44" rx="12" fill="url(#grad-green)"/>
  <rect x="460" y="80" width="370" height="14" fill="url(#grad-green)"/>
  <text x="645" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">供应商端 · 小程序 SupplierQuoteSimulator</text>

  <!-- Container: 报价管理页 -->
  <rect x="860" y="50" width="390" height="720" rx="12" fill="url(#bg-3)" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="860" y="50" width="390" height="44" rx="12" fill="url(#grad-orange)"/>
  <rect x="860" y="80" width="390" height="14" fill="url(#grad-orange)"/>
  <text x="1055" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">采购方后台 · 报价管理 SupplierQuotePage</text>

  <!-- ========== LEFT COLUMN: 采购方后台主流程 ========== -->
  <!-- Node 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="120" width="320" height="52" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="230" y="143" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="600">① 新建工单（采购方式=目录内比价）</text>
    <text x="230" y="161" text-anchor="middle" fill="#64748b" font-size="11">关联需求 → 自动带明细 → 补充上限单价/受邀供应商</text>
  </g>

  <line x1="230" y1="172" x2="230" y2="198" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 2: 草稿 -->
  <g filter="url(#shadow)">
    <rect x="70" y="200" width="320" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="230" y="227" text-anchor="middle" fill="#475569" font-size="14" font-weight="600">📝 草稿 draft</text>
  </g>
  <text x="405" y="227" fill="#6366f1" font-size="11">可反复编辑</text>

  <line x1="230" y1="244" x2="230" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action: 发布 -->
  <rect x="110" y="272" width="240" height="34" rx="17" fill="url(#grad-blue)" filter="url(#shadow)"/>
  <text x="230" y="294" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">点「发布」</text>

  <line x1="230" y1="306" x2="230" y2="332" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 3: 已发布 -->
  <g filter="url(#shadow)">
    <rect x="70" y="334" width="320" height="44" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="230" y="361" text-anchor="middle" fill="#4338ca" font-size="14" font-weight="600">📢 已发布 published</text>
  </g>
  <text x="405" y="361" fill="#64748b" font-size="11">可设置招标时间</text>

  <line x1="230" y1="378" x2="230" y2="404" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action: 开始采购 -->
  <rect x="110" y="406" width="240" height="34" rx="17" fill="url(#grad-blue)" filter="url(#shadow)"/>
  <text x="230" y="428" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">点「开始采购」</text>

  <line x1="230" y1="440" x2="230" y2="466" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 4: 招标中 — 供应商分支从这里岔出 -->
  <g filter="url(#shadow)">
    <rect x="70" y="468" width="320" height="44" rx="10" fill="#fefce8" stroke="#facc15" stroke-width="2"/>
    <text x="230" y="495" text-anchor="middle" fill="#854d0e" font-size="14" font-weight="600">⏳ 招标中 bidding</text>
  </g>

  <!-- Branch: 招标中 → 供应商小程序 -->
  <path d="M 390 490 L 430 490 L 430 300 L 455 300" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)" stroke-dasharray="6,3"/>
  <rect x="400" y="296" width="64" height="20" rx="4" fill="#ffffff"/>
  <text x="432" y="310" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">供应商报价</text>

  <!-- ========== MIDDLE COLUMN: 供应商小程序报价 ========== -->
  <g filter="url(#shadow)">
    <rect x="495" y="120" width="300" height="46" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="645" y="140" text-anchor="middle" fill="#065f46" font-size="13" font-weight="600">① 登录小程序</text>
    <text x="645" y="156" text-anchor="middle" fill="#64748b" font-size="11">看到受邀工单列表（招标中/已截止）</text>
  </g>

  <line x1="645" y1="166" x2="645" y2="190" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="495" y="192" width="300" height="46" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="645" y="212" text-anchor="middle" fill="#065f46" font-size="13" font-weight="600">② 进入工单详情</text>
    <text x="645" y="228" text-anchor="middle" fill="#64748b" font-size="11">看到采购方配置的上限单价 + 单价说明</text>
  </g>

  <line x1="645" y1="238" x2="645" y2="262" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="495" y="264" width="300" height="58" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="645" y="286" text-anchor="middle" fill="#065f46" font-size="13" font-weight="600">③ 逐行填写报价单价</text>
    <text x="645" y="304" text-anchor="middle" fill="#059669" font-size="10">· 选了「上限单价」→ 灰色小字预算上限提示</text>
    <text x="645" y="318" text-anchor="middle" fill="#dc2626" font-size="10">· 超上限 → 红色边框 + 整行警告条</text>
  </g>

  <line x1="645" y1="322" x2="645" y2="346" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="495" y="348" width="300" height="38" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="645" y="371" text-anchor="middle" fill="#047857" font-size="12" font-weight="600">④ 底部实时合计（含税 / 不含税 / 税额）</text>
  </g>

  <line x1="645" y1="386" x2="645" y2="410" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="495" y="412" width="300" height="38" rx="10" fill="url(#grad-green)"/>
    <text x="645" y="436" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">⑤ 提交报价单</text>
  </g>

  <!-- ⚠️ 关键注释 -->
  <rect x="495" y="460" width="300" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="645" y="480" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">⚠️ 关键：报价单去哪儿了？</text>
  <text x="645" y="500" text-anchor="middle" fill="#78350f" font-size="11">写入 SupplierQuote store（独立报价池）</text>
  <text x="645" y="516" text-anchor="middle" fill="#b91c1c" font-size="11">❌ 不直接写入 Bidding.quotes</text>
  <text x="645" y="532" text-anchor="middle" fill="#78350f" font-size="11">👉 要送到工单必须走"回写工单"</text>

  <!-- Arrow: 供应商提交 → 报价管理页 -->
  <path d="M 795 431 L 840 431 L 840 310 L 855 310" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- ========== RIGHT COLUMN: 报价管理页 ========== -->
  <g filter="url(#shadow)">
    <rect x="895" y="118" width="320" height="36" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="1055" y="141" text-anchor="middle" fill="#c2410c" font-size="12" font-weight="600">三种视图：按报价单 / 按物资（推荐） / 按工单</text>
  </g>

  <line x1="1055" y1="154" x2="1055" y2="176" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ① 采纳 -->
  <g filter="url(#shadow)">
    <rect x="895" y="178" width="320" height="82" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="895" y="178" width="320" height="22" rx="10" fill="url(#grad-orange)"/>
    <rect x="895" y="190" width="320" height="10" fill="url(#grad-orange)"/>
    <text x="1055" y="193" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">① 采纳（拍板选这家）</text>
    <text x="1055" y="216" text-anchor="middle" fill="#374151" font-size="11" font-weight="600">按报价单视图 → 同一工单总价最低的整张单</text>
    <text x="1055" y="232" text-anchor="middle" fill="#374151" font-size="11" font-weight="600">按物资视图 → 同一工单+同一物资单价最低的</text>
    <text x="1055" y="250" text-anchor="middle" fill="#ea580c" font-size="10">并列最低 → 弹窗人工指定一家</text>
  </g>

  <!-- 采纳后自动驳回 -->
  <rect x="895" y="270" width="320" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="1055" y="289" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="600">⚠️ 被选中的 → 已采纳；同一工单其他 → 自动已驳回</text>
  <text x="1055" y="304" text-anchor="middle" fill="#b91c1c" font-size="10">落标留痕，不删除不清除</text>

  <line x1="1055" y1="314" x2="1055" y2="336" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ② 回写工单 -->
  <g filter="url(#shadow)">
    <rect x="895" y="338" width="320" height="82" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="895" y="338" width="320" height="22" rx="10" fill="url(#grad-orange)"/>
    <rect x="895" y="350" width="320" height="10" fill="url(#grad-orange)"/>
    <text x="1055" y="353" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">② 回写工单（结果送回招采执行）</text>
    <text x="1055" y="376" text-anchor="middle" fill="#374151" font-size="11">已采纳报价 → 映射成 BiddingQuote</text>
    <text x="1055" y="392" text-anchor="middle" fill="#374151" font-size="11">→ 写入对应工单的 Bidding.quotes 数组</text>
    <text x="1055" y="410" text-anchor="middle" fill="#ea580c" font-size="10">工单自动推进到 bidding（如果还在 draft/published）</text>
  </g>

  <!-- ❌ 不回写的警告 -->
  <rect x="895" y="434" width="320" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="1055" y="456" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="600">❌ 不回写 = 结果卡在本页，整条链断住</text>

  <!-- Arrow: 回写工单 → 送回左边主流程 -->
  <path d="M 895 468 L 420 468 L 420 540 L 395 540" stroke="#6366f1" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="470" y="462" width="160" height="22" rx="4" fill="#ffffff"/>
  <text x="550" y="477" text-anchor="middle" fill="#6366f1" font-size="10" font-weight="700">已采纳结果 → Bidding.quotes</text>

  <!-- ========== BACK TO LEFT COLUMN: 评审 → 完成 → 生成订单 ========== -->
  <rect x="110" y="542" width="240" height="34" rx="17" fill="url(#grad-blue)" filter="url(#shadow)"/>
  <text x="230" y="564" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">点「评审」</text>
  <text x="405" y="564" fill="#64748b" font-size="11">quotes 已就绪，开始评审</text>

  <line x1="230" y1="576" x2="230" y2="602" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="604" width="320" height="44" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="230" y="631" text-anchor="middle" fill="#4338ca" font-size="14" font-weight="600">✅ 已评审 evaluated</text>
  </g>
  <text x="405" y="631" fill="#64748b" font-size="11">可上传评定结果（最多3个附件）</text>

  <line x1="230" y1="648" x2="230" y2="674" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="676" width="240" height="34" rx="17" fill="url(#grad-blue)" filter="url(#shadow)"/>
  <text x="230" y="698" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">点「完成」</text>

  <!-- ⚙️ 自动逻辑 -->
  <rect x="70" y="712" width="320" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="230" y="730" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">⚙️ 系统自动执行：</text>
  <text x="230" y="746" text-anchor="middle" fill="#475569" font-size="11">① 从 Bidding.quotes 取 isQualified 合格报价</text>
  <text x="230" y="762" text-anchor="middle" fill="#475569" font-size="11">② 取含税总额 totalAmount 最低的一家为中标</text>

  <line x1="230" y1="768" x2="230" y2="794" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="796" width="320" height="44" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="230" y="823" text-anchor="middle" fill="#047857" font-size="14" font-weight="700">🎉 已完成 completed</text>
  </g>
  <text x="405" y="823" fill="#047857" font-size="11">中标供应商已锁定</text>

  <line x1="230" y1="840" x2="230" y2="866" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="868" width="240" height="34" rx="17" fill="url(#grad-green)" filter="url(#shadow)"/>
  <text x="230" y="890" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">点「生成采购订单」</text>

  <line x1="230" y1="902" x2="230" y2="928" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="930" width="320" height="56" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="230" y="952" text-anchor="middle" fill="#15803d" font-size="13" font-weight="700">采购订单（CPO+年月日+3位序号）</text>
    <text x="230" y="972" text-anchor="middle" fill="#475569" font-size="11">→ 仓库收货入库 → 招采验收</text>
  </g>

  <!-- ========== Legend & Rules ========== -->
  <rect x="460" y="850" width="790" height="220" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="855" y="875" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="700">图例 & 关键说明</text>

  <circle cx="480" cy="900" r="5" fill="#6366f1"/>
  <text x="495" y="904" fill="#475569" font-size="12">采购方后台主流程（时间从上到下推进）</text>

  <circle cx="480" cy="924" r="5" fill="#059669"/>
  <text x="495" y="928" fill="#475569" font-size="12">供应商端小程序报价（招标期间并行执行）</text>

  <circle cx="480" cy="948" r="5" fill="#ea580c"/>
  <text x="495" y="952" fill="#475569" font-size="12">报价管理页（独立报价池 → 采纳 → 回写）</text>

  <line x1="475" y1="970" x2="495" y2="970" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="974" fill="#475569" font-size="12">主流程动作流转</text>

  <line x1="475" y1="992" x2="495" y2="992" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-orange)"/>
  <text x="500" y="996" fill="#475569" font-size="12">跨页面数据流动（回写工单是必经之路）</text>

  <!-- Rules box -->
  <rect x="870" y="892" width="370" height="170" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1055" y="912" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">目录内比价专属规则（其他 8 种采购方式不走这条链）</text>
  <text x="885" y="934" fill="#64748b" font-size="11">① 供应商报价 → SupplierQuote store（独立池）</text>
  <text x="885" y="950" fill="#64748b" font-size="11">② 必须到报价管理页「采纳 + 回写」</text>
  <text x="885" y="966" fill="#64748b" font-size="11">③ 不回写 = Bidding.quotes 空 = 无法完成</text>
  <text x="885" y="982" fill="#64748b" font-size="11">④ 回写后 CompetitiveBiddingPage 才能评审→完成</text>
  <text x="885" y="998" fill="#64748b" font-size="11">⑤ 完成后才能生成采购订单</text>
  <text x="885" y="1014" fill="#64748b" font-size="11">⑥ 单价说明只有「固定单价」「上限单价」2 选 1</text>
